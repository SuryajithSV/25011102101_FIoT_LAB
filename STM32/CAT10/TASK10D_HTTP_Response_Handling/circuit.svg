  <path d="M 335 178 L 350 226 L 565 226" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="222" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2563eb">TX → RXD</text>
  <path d="M 335 212 L 350 250 L 565 250" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="246" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#16a34a">RX ← TXD</text>
  <rect x="347" y="410" width="396" height="187" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" rx="6"/>
  <text x="359" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#15803d">Circuit Operating Notes</text>
  <line x1="347" y1="437" x2="743" y2="437" stroke="#bbf7d0" stroke-width="1"/>
  <text x="359" y="455" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Listens for incoming client HTTP GET requests: &#x27;+IPD,&lt;id&gt;,&lt;len&gt;:GET...&#x27;.</text>
  <text x="359" y="474" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Extracts client connection ID (&lt;id&gt;).</text>
  <text x="359" y="493" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Sends HTTP 200 OK headers and HTML web page using &#x27;AT+CIPSEND=&lt;id&gt;,&lt;len&gt;&#x27;.</text>
  <text x="359" y="512" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Closes TCP connection cleanly after transmission: &#x27;AT+CIPCLOSE=&lt;id&gt;&#x27;.</text>
