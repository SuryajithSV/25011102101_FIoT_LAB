  <text x="782" y="452" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9f1239">Implementation Notes</text>
  <line x1="770" y1="461" x2="1030" y2="461" stroke="#fecdd3" stroke-width="1"/>
  <text x="782" y="479" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Power ESP8266 from a dedicated 3.3V 500mA regulator</text>
  <text x="782" y="499" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Baud rate for ESP8266 is 115200 bps</text>
  <text x="782" y="519" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Tie CH_PD pin on ESP8266 to 3.3V to enable modem</text>
  <text x="782" y="539" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Verified compilation with armclang</text>
