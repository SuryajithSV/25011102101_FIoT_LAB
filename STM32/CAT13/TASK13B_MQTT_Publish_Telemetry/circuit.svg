<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540">
  <rect x="0" y="0" width="920" height="540" fill="#ffffff" />
  <rect x="8" y="8" width="904" height="524" fill="none" stroke="#cbd5e1" stroke-width="1.5" rx="8" />

  <!-- Header Banner -->
  <rect x="8" y="8" width="904" height="60" fill="#f8fafc" rx="8" />
  <text x="25" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">STM32 CAT 13 / TASK 13B: MQTT Periodic Telemetry Publishing</text>
  <text x="25" y="52" font-family="Arial, sans-serif" font-size="12" fill="#475569">STM32 MCU | Topic: 'stm32/test/data' | QoS 0 Environmental JSON Telemetry</text>

  <!-- MCU Box -->
  <rect x="35" y="85" width="250" height="425" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="8" />
  <text x="160" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0369a1">STM32 MCU</text>
  <text x="160" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0284c7">ARM Cortex Core</text>
  <line x1="35" y1="145" x2="285" y2="145" stroke="#bae6fd" stroke-width="1.5" />
  <text x="50" y="175" font-family="Courier New, monospace" font-size="11" fill="#0f172a">BME280 Sensor</text>
  <text x="50" y="209" font-family="Courier New, monospace" font-size="11" fill="#0f172a">USART2 (PA2/PA3)</text>
  <text x="50" y="243" font-family="Courier New, monospace" font-size="11" fill="#0f172a">MQTT_publishTopic</text>
  <text x="50" y="277" font-family="Courier New, monospace" font-size="11" fill="#0f172a">stm32/test/data</text>
  <text x="50" y="311" font-family="Courier New, monospace" font-size="11" fill="#0f172a">QoS0</text>
  <text x="50" y="345" font-family="Courier New, monospace" font-size="11" fill="#0f172a">1 Hz Publish Rate</text>
  <rect x="175" y="161" width="100" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="4" />
  <text x="270" y="177" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#0369a1">MQTT Broker [broker.emqx.io]</text>
  <line x1="285" y1="175" x2="350" y2="175" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="175" r="3.5" fill="#0284c7" />
  <rect x="175" y="195" width="100" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="4" />
  <text x="270" y="211" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#0369a1">Ingest Topic [stm32/test/data]</text>
  <line x1="285" y1="209" x2="350" y2="209" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="209" r="3.5" fill="#0284c7" />
  <rect x="175" y="229" width="100" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="4" />
  <text x="270" y="245" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#0369a1">Payload JSON [{&quot;temp&quot;:28.45...}]</text>
  <line x1="285" y1="243" x2="350" y2="243" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="243" r="3.5" fill="#0284c7" />
  <rect x="175" y="263" width="100" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="4" />
  <text x="270" y="279" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#0369a1">QoS Level [0 (At most once)]</text>
  <line x1="285" y1="277" x2="350" y2="277" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="277" r="3.5" fill="#0284c7" />
  <rect x="175" y="297" width="100" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="4" />
  <text x="270" y="313" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#0369a1">Subscribers [Node-RED / Apps]</text>
  <line x1="285" y1="311" x2="350" y2="311" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="311" r="3.5" fill="#0284c7" />

  <!-- Peripheral / Target Interface Box -->
  <rect x="350" y="85" width="290" height="295" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="8" />
  <text x="495" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#15803d">MQTT Publisher Engine</text>
  <line x1="350" y1="130" x2="640" y2="130" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="365" y="155" font-family="Arial, sans-serif" font-size="11" fill="#166534">• Periodic Publication API:</text>
  <text x="365" y="177" font-family="Arial, sans-serif" font-size="11" fill="#166534">  MQTT_publishTopic(&quot;stm32/test/data&quot;, payload, QoS0);</text>
  <text x="365" y="199" font-family="Arial, sans-serif" font-size="11" fill="#166534">• Payload Options:</text>
  <text x="365" y="221" font-family="Arial, sans-serif" font-size="11" fill="#166534">  1. Heartbeat test: &quot;hello&quot;</text>
  <text x="365" y="243" font-family="Arial, sans-serif" font-size="11" fill="#166534">  2. Environmental telemetry: {&quot;temp&quot;:28.45,&quot;press&quot;:1008.7,&quot;hum&quot;:62.3}</text>
  <text x="365" y="265" font-family="Arial, sans-serif" font-size="11" fill="#166534">• Publish interval: 1.0 second non-blocking cadence</text>

  <!-- Wiring Details Box -->
  <rect x="350" y="395" width="290" height="115" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" rx="6" />
  <text x="495" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#854d0e">Wiring &amp; Interface Specification</text>
  <line x1="350" y1="428" x2="640" y2="428" stroke="#fef08a" stroke-width="1" />
  <text x="365" y="448" font-family="Arial, sans-serif" font-size="10.5" fill="#713f12">1. Lightweight binary MQTT publish packet generated by driver.</text>
  <text x="365" y="468" font-family="Arial, sans-serif" font-size="10.5" fill="#713f12">2. QoS 0 requires no broker handshake overhead for maximum throughput.</text>
  <text x="365" y="488" font-family="Arial, sans-serif" font-size="10.5" fill="#713f12">3. Validated on public MQTT dashboard / MQTTX client.</text>
  <text x="365" y="508" font-family="Arial, sans-serif" font-size="10.5" fill="#713f12">4. Seamless cloud telemetry streaming.</text>

  <!-- Clock Configuration Box -->
  <rect x="655" y="85" width="240" height="170" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" rx="6" />
  <text x="775" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6b21a8">Clock Configuration</text>
  <line x1="655" y1="120" x2="895" y2="120" stroke="#e9d5ff" stroke-width="1" />
  <text x="670" y="142" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">HSI: 16 MHz Internal RC / HSE Bypass (8MHz)</text>
  <text x="670" y="164" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">PLL: Multiplied to 84 MHz SYSCLK</text>
  <text x="670" y="186" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">HCLK: 84 MHz (Max Cortex-M4 clock)</text>
  <text x="670" y="208" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">APB1: 42 MHz (Timers x2 = 84 MHz)</text>
  <text x="670" y="230" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">APB2: 84 MHz</text>
  <text x="670" y="252" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">SysTick Timer: 1 ms system tick</text>
  <text x="670" y="274" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">Core: ARM Cortex-M4 with FPU @ 84 MHz</text>

  <!-- Power & Reset Reference -->
  <rect x="655" y="270" width="240" height="240" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" rx="6" />
  <text x="775" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9f1239">Power Supply &amp; Control</text>
  <line x1="655" y1="305" x2="895" y2="305" stroke="#fecdd3" stroke-width="1" />
  <text x="670" y="328" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">Supply: 5V USB via ST-LINK or External Vin</text>
  <text x="670" y="350" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">Onboard Step-Down: LD39050PU33R (3.3V / 500mA)</text>
  <text x="670" y="372" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">IO Rail: +3.3V standard CMOS levels</text>
  <text x="670" y="394" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">ST-LINK V2-1: Integrated USB debug probe</text>
  <text x="670" y="416" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">Current consumption: ~20mA run mode</text>
</svg>