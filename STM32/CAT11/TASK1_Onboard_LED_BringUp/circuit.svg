  <text x="359" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#15803d">Circuit Operating Notes</text>
  <line x1="347" y1="437" x2="743" y2="437" stroke="#bbf7d0" stroke-width="1"/>
  <text x="359" y="455" font-family="Arial, sans-serif" font-size="10" fill="#166534">• PA5 connected directly to green user LED LD2 (Active-HIGH configuration).</text>
  <text x="359" y="474" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Driving PA5 HIGH (3.3V) illuminates LED; driving LOW (0V) turns it OFF.</text>
  <text x="359" y="493" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Onboard ST-Link V2-1 supplies power and Virtual COM Port over single USB cable.</text>
  <text x="359" y="512" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Keil MDK-ARM project (LED_TOGGLE_F401RE.uvprojx) compiled and verified.</text>
