  <text x="782" y="479" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Plug USB into Nucleo board ST-Link CN1 connector</text>
  <text x="782" y="499" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Observe green LD2 blinking continuously at 1 Hz</text>
  <text x="782" y="519" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• STM32CubeMX configuration file (.ioc) preserved</text>
  <text x="782" y="539" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Compiled cleanly with armclang</text>
