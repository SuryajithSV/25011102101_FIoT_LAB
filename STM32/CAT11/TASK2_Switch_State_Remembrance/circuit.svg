  <text x="359" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#15803d">Circuit Operating Notes</text>
  <line x1="347" y1="437" x2="743" y2="437" stroke="#bbf7d0" stroke-width="1"/>
  <text x="359" y="455" font-family="Arial, sans-serif" font-size="10" fill="#166534">• PC13 connected to onboard user blue button B1 (Active-LOW with external pull-up).</text>
  <text x="359" y="474" font-family="Arial, sans-serif" font-size="10" fill="#166534">• State memory variable remembers active LED status across loop iterations.</text>
  <text x="359" y="493" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Pressing button flips internal state; releasing button preserves state indefinitely.</text>
  <text x="359" y="512" font-family="Arial, sans-serif" font-size="10" fill="#166534">• 50ms software debounce prevents false triggers on contact bounce.</text>
