<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540">
  <rect x="0" y="0" width="920" height="540" fill="#ffffff" />
  <rect x="8" y="8" width="904" height="524" fill="none" stroke="#cbd5e1" stroke-width="1.5" rx="8" />

  <!-- Header Banner -->
  <rect x="8" y="8" width="904" height="60" fill="#f8fafc" rx="8" />
  <text x="25" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">STM32 CAT 9 / TASK 9A: Basic UART Communication &amp; Character Echo</text>
  <text x="25" y="52" font-family="Arial, sans-serif" font-size="12" fill="#475569">STM32F103C8T6 | USART1 Peripheral | 115200-8-N-1 Serial Terminal Bridge</text>

  <!-- MCU Box -->
  <rect x="35" y="85" width="250" height="425" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="8" />
  <text x="160" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0369a1">STM32F103C8T6</text>
  <text x="160" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0284c7">ARM Cortex-M3 (LQFP48)</text>
  <line x1="35" y1="145" x2="285" y2="145" stroke="#bae6fd" stroke-width="1.5" />
  <text x="50" y="175" font-family="Courier New, monospace" font-size="11" fill="#0f172a">VBAT (Pin 1) - 3.3V Backup</text>
  <text x="50" y="209" font-family="Courier New, monospace" font-size="11" fill="#0f172a">PC13 (Pin 2) - User LED (Active LOW)</text>
  <text x="50" y="243" font-family="Courier New, monospace" font-size="11" fill="#0f172a">NRST (Pin 7) - Master Reset (Active LOW)</text>
  <text x="50" y="277" font-family="Courier New, monospace" font-size="11" fill="#0f172a">VDD_1/2/3 - +3.3V DC Supply Rails</text>
  <text x="50" y="311" font-family="Courier New, monospace" font-size="11" fill="#0f172a">VSS_1/2/3 - 0V System Ground Rails</text>
  <text x="50" y="345" font-family="Courier New, monospace" font-size="11" fill="#0f172a">OSC_IN (PD0, Pin 5) - 8 MHz HSE</text>
  <text x="50" y="379" font-family="Courier New, monospace" font-size="11" fill="#0f172a">OSC_OUT (PD1, Pin 6) - 8 MHz HSE</text>
  <text x="50" y="413" font-family="Courier New, monospace" font-size="11" fill="#0f172a">SWDIO (PA13) / SWCLK (PA14) - SWD</text>
  <rect x="175" y="161" width="100" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="4" />
  <text x="270" y="177" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#0369a1">PA9 (USART1_TX) [Pin 30]</text>
  <line x1="285" y1="175" x2="350" y2="175" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="175" r="3.5" fill="#0284c7" />
  <rect x="175" y="195" width="100" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="4" />
  <text x="270" y="211" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#0369a1">PA10 (USART1_RX) [Pin 31]</text>
  <line x1="285" y1="209" x2="350" y2="209" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="209" r="3.5" fill="#0284c7" />
  <rect x="175" y="229" width="100" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="4" />
  <text x="270" y="245" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#0369a1">PC13 (User LED) [Pin 2]</text>
  <line x1="285" y1="243" x2="350" y2="243" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="243" r="3.5" fill="#0284c7" />
  <rect x="175" y="263" width="100" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="4" />
  <text x="270" y="279" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#0369a1">HAL_UART_Transmit [API]</text>
  <line x1="285" y1="277" x2="350" y2="277" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="277" r="3.5" fill="#0284c7" />
  <rect x="175" y="297" width="100" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="4" />
  <text x="270" y="313" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#0369a1">HAL_UART_Receive [API]</text>
  <line x1="285" y1="311" x2="350" y2="311" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="311" r="3.5" fill="#0284c7" />
  <rect x="175" y="331" width="100" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4" />
  <text x="270" y="347" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#334155">+3.3V [Header]</text>
  <line x1="285" y1="345" x2="350" y2="345" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="345" r="3.5" fill="#0284c7" />
  <rect x="175" y="365" width="100" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4" />
  <text x="270" y="381" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#334155">GND [Header]</text>
  <line x1="285" y1="379" x2="350" y2="379" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="379" r="3.5" fill="#0284c7" />

  <!-- Peripheral / Target Interface Box -->
  <rect x="350" y="85" width="290" height="295" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="8" />
  <text x="495" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#15803d">USB-to-UART Bridge &amp; PuTTY Interface</text>
  <line x1="350" y1="130" x2="640" y2="130" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="365" y="155" font-family="Arial, sans-serif" font-size="11" fill="#166534">• Serial Port: USART1 @ 115200 Baud, 8 Data Bits, 1 Stop Bit, No Parity</text>
  <text x="365" y="177" font-family="Arial, sans-serif" font-size="11" fill="#166534">• Interfacing:</text>
  <text x="365" y="199" font-family="Arial, sans-serif" font-size="11" fill="#166534">  - STM32 PA9 (TX) -&gt; USB-TTL RXD</text>
  <text x="365" y="221" font-family="Arial, sans-serif" font-size="11" fill="#166534">  - STM32 PA10 (RX) -&gt; USB-TTL TXD</text>
  <text x="365" y="243" font-family="Arial, sans-serif" font-size="11" fill="#166534">  - Common Ground connected to USB-TTL GND</text>
  <text x="365" y="265" font-family="Arial, sans-serif" font-size="11" fill="#166534">• Functionality:</text>
  <text x="365" y="287" font-family="Arial, sans-serif" font-size="11" fill="#166534">  1. Transmit string banner upon startup</text>
  <text x="365" y="309" font-family="Arial, sans-serif" font-size="11" fill="#166534">  2. Receive inbound characters and immediately echo back to PC</text>

  <!-- Wiring Details Box -->
  <rect x="350" y="395" width="290" height="115" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" rx="6" />
  <text x="495" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#854d0e">Wiring &amp; Interface Specification</text>
  <line x1="350" y1="428" x2="640" y2="428" stroke="#fef08a" stroke-width="1" />
  <text x="365" y="448" font-family="Arial, sans-serif" font-size="10.5" fill="#713f12">1. USART1 clock enabled via RCC APB2 peripheral clock bus.</text>
  <text x="365" y="468" font-family="Arial, sans-serif" font-size="10.5" fill="#713f12">2. Line endings investigated: \r (CR), \n (LF), and \r\n (CRLF).</text>
  <text x="365" y="488" font-family="Arial, sans-serif" font-size="10.5" fill="#713f12">3. PuTTY terminal configured for 115200-8-N-1 without local echo.</text>
  <text x="365" y="508" font-family="Arial, sans-serif" font-size="10.5" fill="#713f12">4. HAL_UART_Receive polling with 100ms timeout.</text>

  <!-- Clock Configuration Box -->
  <rect x="655" y="85" width="240" height="170" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" rx="6" />
  <text x="775" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6b21a8">Clock Configuration</text>
  <line x1="655" y1="120" x2="895" y2="120" stroke="#e9d5ff" stroke-width="1" />
  <text x="670" y="142" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">HSE: 8.0 MHz External Crystal</text>
  <text x="670" y="164" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">PLL Multiplier: x9 -&gt; SYSCLK = 72 MHz</text>
  <text x="670" y="186" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">AHB Prescaler: /1 -&gt; HCLK = 72 MHz</text>
  <text x="670" y="208" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">APB1 Prescaler: /2 -&gt; PCLK1 = 36 MHz (Max)</text>
  <text x="670" y="230" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">APB2 Prescaler: /1 -&gt; PCLK2 = 72 MHz</text>
  <text x="670" y="252" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">SysTick: 1.0 ms interrupt timebase</text>
  <text x="670" y="274" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">Core: ARM Cortex-M3 32-bit RISC</text>

  <!-- Power & Reset Reference -->
  <rect x="655" y="270" width="240" height="240" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" rx="6" />
  <text x="775" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9f1239">Power Supply &amp; Control</text>
  <line x1="655" y1="305" x2="895" y2="305" stroke="#fecdd3" stroke-width="1" />
  <text x="670" y="328" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">Operating Rail: +3.3V DC</text>
  <text x="670" y="350" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">Onboard LDO: RT9193-3.3 (5V to 3.3V)</text>
  <text x="670" y="372" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">Decoupling: 100nF ceramic per VDD/VSS</text>
  <text x="670" y="394" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">SWD Header: 3.3V, SWDIO, SWCLK, GND</text>
  <text x="670" y="416" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">Reset: Internal pull-up + 100nF to GND</text>
</svg>