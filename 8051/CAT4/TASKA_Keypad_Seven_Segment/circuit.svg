  <text x="647" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#854d0e">Rows: P2.0-P2.3</text>
  <text x="647" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#854d0e">Cols: P2.4-P2.7</text>
  <rect x="347" y="410" width="396" height="187" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" rx="6"/>
  <text x="359" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#15803d">Circuit Operating Notes</text>
  <line x1="347" y1="437" x2="743" y2="437" stroke="#bbf7d0" stroke-width="1"/>
  <text x="359" y="455" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Port 2 rows (P2.0-P2.3) grounded sequentially during scanning.</text>
  <text x="359" y="474" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Port 2 columns (P2.4-P2.7) read with internal pull-ups to detect key press.</text>
  <text x="359" y="493" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Port 0 requires external 10kΩ pull-up resistor network (open-drain port).</text>
  <text x="359" y="512" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Decoded 0-F hex value displayed directly on 7-segment display.</text>
