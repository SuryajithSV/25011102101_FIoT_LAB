  <line x1="770" y1="313" x2="1030" y2="313" stroke="#e9d5ff" stroke-width="1"/>
  <text x="782" y="332" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#7e22ce">Crystal:</text>
  <text x="865" y="332" font-family="Courier New, monospace" font-size="9.5" fill="#581c87">11.0592 MHz</text>
