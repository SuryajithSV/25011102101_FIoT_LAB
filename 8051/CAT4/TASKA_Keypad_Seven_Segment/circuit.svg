  <text x="865" y="392" font-family="Courier New, monospace" font-size="9.5" fill="#581c87">+5.0V DC</text>
  <rect x="770" y="435" width="260" height="172" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" rx="6"/>
  <rect x="770" y="435" width="260" height="26" fill="#ffe4e6" rx="6"/>
  <text x="782" y="452" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9f1239">Implementation Notes</text>
  <line x1="770" y1="461" x2="1030" y2="461" stroke="#fecdd3" stroke-width="1"/>
  <text x="782" y="479" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• 10kΩ resistor bus array required on Port 0</text>
  <text x="782" y="499" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Row scanning rate: ~20ms debounce period</text>
  <text x="782" y="519" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Press keys 0-9, A-D, *, # to observe display updates</text>
  <text x="782" y="539" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Look-up table translates scan codes to 7-segment hex</text>
