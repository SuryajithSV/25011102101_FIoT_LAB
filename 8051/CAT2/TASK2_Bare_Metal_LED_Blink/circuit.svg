<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540">
  <rect x="0" y="0" width="920" height="540" fill="#ffffff" />
  <rect x="8" y="8" width="904" height="524" fill="none" stroke="#cbd5e1" stroke-width="1.5" rx="8" />

  <!-- Header Banner -->
  <rect x="8" y="8" width="904" height="60" fill="#f8fafc" rx="8" />
  <text x="25" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">8051 Microcontroller - CAT 2 / TASK 2: Bare-Metal LED Blink</text>
  <text x="25" y="52" font-family="Arial, sans-serif" font-size="12" fill="#475569">Platform: AT89S52 DIP-40 | Port 1 Pin 0 (P1.0) | Active-High LED with 330Ω Current Limiter</text>

  <!-- MCU Box -->
  <rect x="35" y="85" width="250" height="425" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="8" />
  <text x="160" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0369a1">AT89S52</text>
  <text x="160" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0284c7">8051 Core (DIP-40)</text>
  <line x1="35" y1="145" x2="285" y2="145" stroke="#bae6fd" stroke-width="1.5" />
  <text x="50" y="175" font-family="Courier New, monospace" font-size="11" fill="#0f172a">VCC (Pin 40) - 5V DC</text>
  <text x="50" y="209" font-family="Courier New, monospace" font-size="11" fill="#0f172a">GND (Pin 20) - 0V DC</text>
  <text x="50" y="243" font-family="Courier New, monospace" font-size="11" fill="#0f172a">EA/VPP (Pin 31) - Internal ROM</text>
  <text x="50" y="277" font-family="Courier New, monospace" font-size="11" fill="#0f172a">RST (Pin 9) - Active-High Reset</text>
  <text x="50" y="311" font-family="Courier New, monospace" font-size="11" fill="#0f172a">XTAL1 (Pin 19) - Crystal In</text>
  <text x="50" y="345" font-family="Courier New, monospace" font-size="11" fill="#0f172a">XTAL2 (Pin 18) - Crystal Out</text>
  <text x="50" y="379" font-family="Courier New, monospace" font-size="11" fill="#0f172a">ALE/PROG (Pin 30) - Latch</text>
  <text x="50" y="413" font-family="Courier New, monospace" font-size="11" fill="#0f172a">PSEN (Pin 29) - Program Strobe</text>
  <rect x="175" y="161" width="100" height="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="4" />
  <text x="270" y="177" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#0369a1">P1.0 [Pin 1]</text>
  <line x1="285" y1="175" x2="350" y2="175" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="175" r="3.5" fill="#0284c7" />
  <rect x="175" y="195" width="100" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4" />
  <text x="270" y="211" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#334155">P1.1 [Pin 2]</text>
  <line x1="285" y1="209" x2="350" y2="209" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="209" r="3.5" fill="#0284c7" />
  <rect x="175" y="229" width="100" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4" />
  <text x="270" y="245" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#334155">P1.2 [Pin 3]</text>
  <line x1="285" y1="243" x2="350" y2="243" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="243" r="3.5" fill="#0284c7" />
  <rect x="175" y="263" width="100" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4" />
  <text x="270" y="279" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#334155">P1.3 [Pin 4]</text>
  <line x1="285" y1="277" x2="350" y2="277" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="277" r="3.5" fill="#0284c7" />
  <rect x="175" y="297" width="100" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4" />
  <text x="270" y="313" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#334155">P1.4 [Pin 5]</text>
  <line x1="285" y1="311" x2="350" y2="311" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="311" r="3.5" fill="#0284c7" />
  <rect x="175" y="331" width="100" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4" />
  <text x="270" y="347" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#334155">P1.5 [Pin 6]</text>
  <line x1="285" y1="345" x2="350" y2="345" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="345" r="3.5" fill="#0284c7" />
  <rect x="175" y="365" width="100" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4" />
  <text x="270" y="381" text-anchor="end" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#334155">P1.6 [Pin 7]</text>
  <line x1="285" y1="379" x2="350" y2="379" stroke="#0284c7" stroke-width="2" />
  <circle cx="285" cy="379" r="3.5" fill="#0284c7" />

  <!-- Peripheral / Target Interface Box -->
  <rect x="350" y="85" width="290" height="295" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="8" />
  <text x="495" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#15803d">Active-High User LED Circuit</text>
  <line x1="350" y1="130" x2="640" y2="130" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="365" y="155" font-family="Arial, sans-serif" font-size="11" fill="#166534">• P1.0 configured as push-pull / quasi-bidirectional output</text>
  <text x="365" y="177" font-family="Arial, sans-serif" font-size="11" fill="#166534">• Output HIGH (5V) drives current into LED anode</text>
  <text x="365" y="199" font-family="Arial, sans-serif" font-size="11" fill="#166534">• Output LOW (0V) extinguishes the LED</text>
  <text x="365" y="221" font-family="Arial, sans-serif" font-size="11" fill="#166534">• Current limiting resistor calculation:</text>
  <text x="365" y="243" font-family="Arial, sans-serif" font-size="11" fill="#166534">  R = (VCC - V_led) / I_led</text>
  <text x="365" y="265" font-family="Arial, sans-serif" font-size="11" fill="#166534">    = (5.0V - 1.8V) / 10mA = 320Ω ≈ 330Ω</text>
  <text x="365" y="287" font-family="Arial, sans-serif" font-size="11" fill="#166534">• Switching frequency calibrated to ~1.0 Hz</text>

  <!-- Wiring Details Box -->
  <rect x="350" y="395" width="290" height="115" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" rx="6" />
  <text x="495" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#854d0e">Wiring &amp; Interface Specification</text>
  <line x1="350" y1="428" x2="640" y2="428" stroke="#fef08a" stroke-width="1" />
  <text x="365" y="448" font-family="Arial, sans-serif" font-size="10.5" fill="#713f12">1. P1.0 (Pin 1) connects to 330Ω resistor terminal 1.</text>
  <text x="365" y="468" font-family="Arial, sans-serif" font-size="10.5" fill="#713f12">2. 330Ω resistor terminal 2 connects to LED anode (+).</text>
  <text x="365" y="488" font-family="Arial, sans-serif" font-size="10.5" fill="#713f12">3. LED cathode (-) connects to 0V system ground (Pin 20).</text>
  <text x="365" y="508" font-family="Arial, sans-serif" font-size="10.5" fill="#713f12">4. Software delay generates ~500 ms ON and ~500 ms OFF.</text>

  <!-- Clock Configuration Box -->
  <rect x="655" y="85" width="240" height="170" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" rx="6" />
  <text x="775" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6b21a8">Clock Configuration</text>
  <line x1="655" y1="120" x2="895" y2="120" stroke="#e9d5ff" stroke-width="1" />
  <text x="670" y="142" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">External Crystal: 11.0592 MHz</text>
  <text x="670" y="164" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">Oscillator Caps: 2x 33 pF ceramic</text>
  <text x="670" y="186" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">Machine Cycle = 12 clock periods</text>
  <text x="670" y="208" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">T_cycle = 12 / 11.0592 MHz</text>
  <text x="670" y="230" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">        = 1.085069 μs</text>
  <text x="670" y="252" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">Timer 0/1 clock = 921.6 kHz</text>
  <text x="670" y="274" font-family="Arial, sans-serif" font-size="10.5" fill="#581c87">Standard UART reload compatible</text>

  <!-- Power & Reset Reference -->
  <rect x="655" y="270" width="240" height="240" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" rx="6" />
  <text x="775" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9f1239">Power Supply &amp; Control</text>
  <line x1="655" y1="305" x2="895" y2="305" stroke="#fecdd3" stroke-width="1" />
  <text x="670" y="328" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">VCC: +5.0V DC stabilized</text>
  <text x="670" y="350" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">GND: 0V System Ground</text>
  <text x="670" y="372" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">Reset Circuit: 10μF electrolytic</text>
  <text x="670" y="394" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">  to VCC + 10kΩ resistor to GND</text>
  <text x="670" y="416" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">EA/VPP Pin 31: Tied to +5V (VCC)</text>
  <text x="670" y="438" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">  enables execution from on-chip ROM</text>
  <text x="670" y="460" font-family="Arial, sans-serif" font-size="10.5" fill="#881337">Decoupling: 0.1μF MLCC across VCC-GND</text>
</svg>