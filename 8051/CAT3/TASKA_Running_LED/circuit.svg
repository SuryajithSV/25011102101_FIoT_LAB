  <text x="547" y="317" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">Common GND</text>
  <rect x="347" y="410" width="396" height="187" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" rx="6"/>
  <text x="359" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#15803d">Circuit Operating Notes</text>
  <line x1="347" y1="437" x2="743" y2="437" stroke="#bbf7d0" stroke-width="1"/>
  <text x="359" y="455" font-family="Arial, sans-serif" font-size="10" fill="#166534">• 4x LEDs on P1.0 to P1.3 with 330Ω current-limiting resistors.</text>
  <text x="359" y="474" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Bit shift logic: Single LED illuminated at a time (0x01 -&gt; 0x02 -&gt; 0x04 -&gt; 0x08).</text>
  <text x="359" y="493" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Push-button on P3.2 (/INT0) with 10kΩ pull-up resistor for mode trigger.</text>
  <text x="359" y="512" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Delay interval of 200ms between bit shifts produces smooth running motion.</text>
