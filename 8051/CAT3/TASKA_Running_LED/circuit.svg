  <text x="782" y="479" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Connect 4 LEDs with individual 330Ω resistors</text>
  <text x="782" y="499" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Observe chaser sequence from LED0 to LED3 and wrap</text>
  <text x="782" y="519" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Adjust delay_ms() value to change chaser speed</text>
  <text x="782" y="539" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• All unused Port 1 pins remain HIGH by default</text>
