  <rect x="30" y="92" width="280" height="48" fill="#e0f2fe" rx="8"/>
  <text x="170" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0369a1">AT89S52</text>
  <text x="170" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0284c7">8051 Architecture (DIP-40)</text>
  <line x1="30" y1="140" x2="310" y2="140" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="42" y="158" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748b">SYSTEM / POWER</text>
  <text x="298" y="158" text-anchor="end" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0284c7">ACTIVE I/O PINS</text>
