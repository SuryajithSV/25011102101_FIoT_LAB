  <text x="50" y="207" font-family="Courier New, monospace" font-size="10" fill="#334155">GND [Pin 20]</text>
  <circle cx="40" cy="228" r="3" fill="#94a3b8"/>
  <text x="50" y="232" font-family="Courier New, monospace" font-size="10" fill="#334155">RST [Pin 9]</text>
  <circle cx="40" cy="253" r="3" fill="#94a3b8"/>
  <text x="50" y="257" font-family="Courier New, monospace" font-size="10" fill="#334155">EA [Pin 31]</text>
  <circle cx="40" cy="278" r="3" fill="#94a3b8"/>
  <text x="50" y="282" font-family="Courier New, monospace" font-size="10" fill="#334155">XTAL1 [Pin 19]</text>
  <circle cx="40" cy="303" r="3" fill="#94a3b8"/>
  <text x="50" y="307" font-family="Courier New, monospace" font-size="10" fill="#334155">XTAL2 [Pin 18]</text>
