  <text x="294" y="216" text-anchor="end" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#0369a1">P2.1 [Coil B]</text>
  <line x1="310" y1="212" x2="335" y2="212" stroke="#0284c7" stroke-width="1.8"/>
  <circle cx="310" cy="212" r="2.8" fill="#0284c7"/>
