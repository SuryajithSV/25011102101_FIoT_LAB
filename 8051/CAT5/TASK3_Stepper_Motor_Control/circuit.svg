  <text x="294" y="250" text-anchor="end" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#0369a1">P2.2 [Coil C]</text>
  <line x1="310" y1="246" x2="335" y2="246" stroke="#0284c7" stroke-width="1.8"/>
  <circle cx="310" cy="246" r="2.8" fill="#0284c7"/>
  <rect x="202" y="270" width="98" height="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" rx="4"/>
  <text x="294" y="284" text-anchor="end" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#0369a1">P2.3 [Coil D]</text>
  <line x1="310" y1="280" x2="335" y2="280" stroke="#0284c7" stroke-width="1.8"/>
  <circle cx="310" cy="280" r="2.8" fill="#0284c7"/>
