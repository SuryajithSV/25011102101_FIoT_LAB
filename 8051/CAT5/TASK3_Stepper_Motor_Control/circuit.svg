  <text x="545" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">ULN2003 Stepper Motor Driver Circuit</text>
  <line x1="335" y1="130" x2="755" y2="130" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="347" y="140" width="396" height="260" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <rect x="565" y="170" width="165" height="155" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" rx="6"/>
  <rect x="565" y="170" width="165" height="26" fill="#ffedd5" rx="6"/>
  <text x="647" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c2410c">ULN2003 Stepper Driver</text>
  <text x="573" y="214" font-family="Courier New, monospace" font-size="9" font-weight="bold" fill="#9a3412">IN1 -> Coil A</text>
  <text x="722" y="214" text-anchor="end" font-family="Arial, sans-serif" font-size="8.5" fill="#c2410c">P2.0</text>
  <text x="573" y="236" font-family="Courier New, monospace" font-size="9" font-weight="bold" fill="#9a3412">IN2 -> Coil B</text>
  <text x="722" y="236" text-anchor="end" font-family="Arial, sans-serif" font-size="8.5" fill="#c2410c">P2.1</text>
  <text x="573" y="258" font-family="Courier New, monospace" font-size="9" font-weight="bold" fill="#9a3412">IN3 -> Coil C</text>
  <text x="722" y="258" text-anchor="end" font-family="Arial, sans-serif" font-size="8.5" fill="#c2410c">P2.2</text>
  <text x="573" y="280" font-family="Courier New, monospace" font-size="9" font-weight="bold" fill="#9a3412">IN4 -> Coil D</text>
  <text x="722" y="280" text-anchor="end" font-family="Arial, sans-serif" font-size="8.5" fill="#c2410c">P2.3</text>
  <text x="573" y="302" font-family="Courier New, monospace" font-size="9" font-weight="bold" fill="#9a3412">+5V / GND</text>
  <text x="722" y="302" text-anchor="end" font-family="Arial, sans-serif" font-size="8.5" fill="#c2410c">Ext Pwr</text>
  <rect x="347" y="410" width="396" height="187" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" rx="6"/>
  <text x="359" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#15803d">Circuit Operating Notes</text>
  <line x1="347" y1="437" x2="743" y2="437" stroke="#bbf7d0" stroke-width="1"/>
  <text x="359" y="455" font-family="Arial, sans-serif" font-size="10" fill="#166534">• 4x Darlington pairs inside ULN2003 sink coil currents up to 500mA.</text>
  <text x="359" y="474" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Port 2 outputs (P2.0-P2.3) energize coils in 4-step wave/full-step sequence.</text>
  <text x="359" y="493" font-family="Arial, sans-serif" font-size="10" fill="#166534">• External +5V power supply powers motor coils (decoupled from MCU VCC).</text>
  <text x="359" y="512" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Step sequence: 0x09 (A+D) -&gt; 0x0C (A+B) -&gt; 0x06 (B+C) -&gt; 0x03 (C+D).</text>
  <rect x="770" y="92" width="260" height="185" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <rect x="770" y="92" width="260" height="26" fill="#f8fafc" rx="6"/>
  <text x="782" y="109" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Pin Connections</text>
  <line x1="770" y1="118" x2="1030" y2="118" stroke="#e2e8f0" stroke-width="1"/>
  <text x="780" y="136" font-family="Courier New, monospace" font-size="9" font-weight="bold" fill="#0369a1">P2.0 (Pin 21)</text>
  <text x="848" y="136" font-family="Arial, sans-serif" font-size="9" fill="#334155">ULN2003 IN1</text>
  <text x="938" y="136" font-family="Arial, sans-serif" font-size="8.5" fill="#64748b">Phase A</text>
  <line x1="780" y1="140" x2="1020" y2="140" stroke="#f1f5f9" stroke-width="1"/>
  <text x="780" y="158" font-family="Courier New, monospace" font-size="9" font-weight="bold" fill="#0369a1">P2.1 (Pin 22)</text>
  <text x="848" y="158" font-family="Arial, sans-serif" font-size="9" fill="#334155">ULN2003 IN2</text>
  <text x="938" y="158" font-family="Arial, sans-serif" font-size="8.5" fill="#64748b">Phase B</text>
  <line x1="780" y1="162" x2="1020" y2="162" stroke="#f1f5f9" stroke-width="1"/>
  <text x="780" y="180" font-family="Courier New, monospace" font-size="9" font-weight="bold" fill="#0369a1">P2.2 (Pin 23)</text>
  <text x="848" y="180" font-family="Arial, sans-serif" font-size="9" fill="#334155">ULN2003 IN3</text>
  <text x="938" y="180" font-family="Arial, sans-serif" font-size="8.5" fill="#64748b">Phase C</text>
  <line x1="780" y1="184" x2="1020" y2="184" stroke="#f1f5f9" stroke-width="1"/>
  <text x="780" y="202" font-family="Courier New, monospace" font-size="9" font-weight="bold" fill="#0369a1">P2.3 (Pin 24)</text>
  <text x="848" y="202" font-family="Arial, sans-serif" font-size="9" fill="#334155">ULN2003 IN4</text>
  <text x="938" y="202" font-family="Arial, sans-serif" font-size="8.5" fill="#64748b">Phase D</text>
  <line x1="780" y1="206" x2="1020" y2="206" stroke="#f1f5f9" stroke-width="1"/>
  <text x="780" y="224" font-family="Courier New, monospace" font-size="9" font-weight="bold" fill="#0369a1">EXT +5V</text>
  <text x="848" y="224" font-family="Arial, sans-serif" font-size="9" fill="#334155">Motor Common</text>
  <text x="938" y="224" font-family="Arial, sans-serif" font-size="8.5" fill="#64748b">Motor Power</text>
  <line x1="780" y1="228" x2="1020" y2="228" stroke="#f1f5f9" stroke-width="1"/>
  <text x="780" y="246" font-family="Courier New, monospace" font-size="9" font-weight="bold" fill="#0369a1">Pin 20 (GND)</text>
  <text x="848" y="246" font-family="Arial, sans-serif" font-size="9" fill="#334155">ULN2003 GND</text>
  <text x="938" y="246" font-family="Arial, sans-serif" font-size="8.5" fill="#64748b">Common Ground</text>
  <line x1="780" y1="250" x2="1020" y2="250" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="770" y="287" width="260" height="138" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" rx="6"/>
  <rect x="770" y="287" width="260" height="26" fill="#f3e8ff" rx="6"/>
  <text x="782" y="304" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6b21a8">Clock &amp; Power</text>
  <line x1="770" y1="313" x2="1030" y2="313" stroke="#e9d5ff" stroke-width="1"/>
  <text x="782" y="332" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#7e22ce">Crystal:</text>
  <text x="865" y="332" font-family="Courier New, monospace" font-size="9.5" fill="#581c87">11.0592 MHz</text>
  <text x="782" y="352" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#7e22ce">Machine Cyc:</text>
  <text x="865" y="352" font-family="Courier New, monospace" font-size="9.5" fill="#581c87">12 Clocks</text>
  <text x="782" y="372" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#7e22ce">T_cycle:</text>
  <text x="865" y="372" font-family="Courier New, monospace" font-size="9.5" fill="#581c87">1.085 μs</text>
  <text x="782" y="392" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#7e22ce">Logic Rail:</text>
  <text x="865" y="392" font-family="Courier New, monospace" font-size="9.5" fill="#581c87">+5.0V DC</text>
  <rect x="770" y="435" width="260" height="172" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" rx="6"/>
  <rect x="770" y="435" width="260" height="26" fill="#ffe4e6" rx="6"/>
  <text x="782" y="452" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9f1239">Implementation Notes</text>
  <line x1="770" y1="461" x2="1030" y2="461" stroke="#fecdd3" stroke-width="1"/>
  <text x="782" y="479" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Never power stepper motor directly from 8051 GPIO pins</text>
  <text x="782" y="499" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Common ground must tie 8051 GND and external +5V PSU GND</text>
  <text x="782" y="519" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Step delay of 15ms provides smooth torque without slipping</text>
  <text x="782" y="539" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Reversing sequence reverses motor rotation direction</text>
</svg>