  <rect x="12" y="12" width="6" height="66" fill="#0284c7" rx="2"/>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">8051 Microcontroller - CAT 5 / TASK 3: ULN2003 Stepper Motor Control</text>
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="12" fill="#475569">4-Phase Unipolar Stepper Motor Drive via ULN2003 Darlington Array</text>
