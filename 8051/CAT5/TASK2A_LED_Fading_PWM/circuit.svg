  <text x="865" y="392" font-family="Courier New, monospace" font-size="9.5" fill="#581c87">+5.0V DC</text>
  <rect x="770" y="435" width="260" height="172" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" rx="6"/>
  <rect x="770" y="435" width="260" height="26" fill="#ffe4e6" rx="6"/>
  <text x="782" y="452" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9f1239">Implementation Notes</text>
