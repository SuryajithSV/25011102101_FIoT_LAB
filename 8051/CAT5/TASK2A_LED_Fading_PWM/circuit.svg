  <text x="782" y="479" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Observe continuous smooth breathing effect on LED</text>
  <text x="782" y="499" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• PWM period = 5 ms (frequency ~200 Hz)</text>
  <text x="782" y="519" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Duty cycle steps in increments of 1% every 10ms</text>
  <text x="782" y="539" font-family="Arial, sans-serif" font-size="9.5" fill="#881337">• Oscilloscope shows pulse width modulation between 0V and 5V</text>
