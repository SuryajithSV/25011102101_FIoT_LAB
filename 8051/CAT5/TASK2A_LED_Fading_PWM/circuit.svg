  <rect x="347" y="410" width="396" height="187" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" rx="6"/>
  <text x="359" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#15803d">Circuit Operating Notes</text>
  <line x1="347" y1="437" x2="743" y2="437" stroke="#bbf7d0" stroke-width="1"/>
  <text x="359" y="455" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Software PWM period divided into 100 discrete time slices.</text>
  <text x="359" y="474" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Duty cycle sweeps linearly from 0% (off) to 100% (max) and back.</text>
  <text x="359" y="493" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Frequency: ~200 Hz, well above human eye persistence-of-vision limit.</text>
  <text x="359" y="512" font-family="Arial, sans-serif" font-size="10" fill="#166534">• Smooth visual breathing/pulsing effect without visible flicker.</text>
